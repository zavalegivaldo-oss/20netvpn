<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZeroNet VPN</title>
<style>
:root{--bg:#000;--card:#0A0A1A;--blue:#1565C0;--blue-dark:#0A0E4A;--green:#10B981;--white:#FFF}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--white);max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#05050F;position:relative;z-index:5}
.logo-box{background:#000;padding:6px 10px;border-radius:4px;border-bottom:3px solid var(--blue)}
.logo{font-size:22px;font-weight:900;letter-spacing:2px;line-height:1}
.logo .accent{color:var(--blue);font-size:26px;line-height:0}
.logo-sub{font-size:9px;color:#aaa;margin-top:2px;letter-spacing:1px}
.menu{width:28px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.menu span{height:2px;background:var(--blue);border-radius:2px}
.screen{flex:1;overflow-y:auto;padding:16px 16px 30px}
.top-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.select-card{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--blue-dark);cursor:pointer;border-top:2px solid var(--blue)}
.select-card label{font-size:11px;color:#7799CC;letter-spacing:1px;font-weight:700}
.select-card .val{font-size:15px;color:var(--blue);font-weight:900;margin-top:4px}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:13px;margin-bottom:16px;text-align:center;min-height:20px;letter-spacing:1px}
.status-dot{width:10px;height:10px;border-radius:50%;background:#555;flex-shrink:0;transition:background .4s}
.status.connected{color:var(--green)}
.status.connected .status-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.status.connecting .status-dot{background:var(--blue);animation:blink 1s infinite}
.status.error{color:#FF5555}
.status.error .status-dot{background:#FF5555}
@keyframes blink{50%{opacity:.3}}
.btn-wrap{width:190px;height:190px;margin:0 auto 24px;position:relative}
.btn-circle{width:190px;height:190px;border-radius:50%;position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--white);cursor:pointer;background:#0A0A1A;box-shadow:inset 0 0 0 8px #000;text-align:center;padding:0 20px;letter-spacing:2px;transition:background .5s}
.btn-circle::before{content:'';position:absolute;width:148px;height:148px;border-radius:50%;background:#000;z-index:1}
.btn-circle span{position:relative;z-index:2;transition:color .5s}
.btn-circle.on{background:#052a1a;box-shadow:inset 0 0 0 8px #000,0 0 20px rgba(16,185,129,.3)}
.progress{position:absolute;top:0;left:0;width:190px;height:190px;transform:rotate(-90deg);z-index:3;pointer-events:none}
.progress circle{fill:none;stroke-width:7;stroke-linecap:round}
.progress .bg{stroke:#0A0A1A}
.progress .bar{stroke:var(--blue);stroke-dasharray:535;stroke-dashoffset:535;transition:stroke-dashoffset .08s linear,stroke .5s}
.progress.connected .bar{stroke:var(--green)}
@keyframes spinRing{to{stroke-dashoffset:0}}
.stats-2{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:14px}
.stat-box{background:var(--card);border:2px solid var(--blue-dark);border-radius:10px;padding:14px;text-align:center;border-top:2px solid var(--blue);transition:border-top-color .5s}
.stat-box.active{border-top-color:var(--green)}
.stat-box .arrow{font-size:20px;color:var(--blue);line-height:1;margin-bottom:4px;transition:color .5s}
.stat-box.active .arrow{color:var(--green)}
.stat-box.down .arrow{transform:rotate(180deg)}
.stat-box .val{font-size:26px;font-weight:900;line-height:1}
.stat-box .unit{font-size:11px;color:#7799CC;margin-left:2px}
.stat-box .lbl{font-size:10px;color:#7799CC;margin-top:4px;font-weight:700;letter-spacing:1px}
.refresh-btn{width:50px;height:50px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;cursor:pointer;flex-shrink:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:var(--card);border-radius:10px;padding:13px;border:1px solid var(--blue-dark);border-left:3px solid var(--blue)}
.card label{font-size:10px;color:#7799CC;font-weight:700;letter-spacing:.5px}
.card .val{font-size:18px;font-weight:900;margin-top:4px}
.graph-card{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--blue-dark);border-left:3px solid var(--blue);margin-bottom:10px}
.graph-card label{font-size:10px;color:#7799CC;font-weight:700;letter-spacing:.5px;display:block;margin-bottom:8px}
.graph-wrap{position:relative;width:100%;height:80px}
#speedGraph{width:100%;height:80px;display:block}
.graph-levels{position:absolute;top:0;right:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.graph-levels span{font-size:8px;color:#334466;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="logo-box">
    <div class="logo">ZERO<span class="accent">N</span>ET</div>
    <div class="logo-sub">ZeroNet VPN • SECURE</div>
  </div>
  <div class="menu"><span></span><span></span><span></span></div>
</header>

<div class="screen">
  <div class="top-select">
    <div class="select-card" onclick="openServers()"><label>SERVIDOR</label><div class="val" id="servidorLabel">Maputo 01</div></div>
    <div class="select-card" onclick="openCountries()"><label>PAÍS</label><div class="val" id="paisLabel">Moçambique</div></div>
  </div>

  <div class="status" id="statusRow"><div class="status-dot"></div><span id="statusTxt">DESCONECTADO</span></div>

  <div class="btn-wrap">
    <svg class="progress" id="progressSvg" viewBox="0 0 190 190">
      <circle class="bg" cx="95" cy="95" r="85"></circle>
      <circle class="bar" id="bar" cx="95" cy="95" r="85"></circle>
    </svg>
    <div class="btn-circle" id="btnCircle" onclick="toggle()"><span id="btnTxt">CONECTAR</span></div>
  </div>

  <div class="stats-2">
    <div class="stat-box down" id="boxDown">
      <div class="arrow">↓</div>
      <div><span class="val" id="downVal">0</span><span class="unit" id="downUnit">KB</span></div>
      <div class="lbl">DOWNLOAD</div>
    </div>
    <div class="refresh-btn" onclick="reset()">↻</div>
    <div class="stat-box up" id="boxUp">
      <div class="arrow">↑</div>
      <div><span class="val" id="upVal">0</span><span class="unit" id="upUnit">KB</span></div>
      <div class="lbl">UPLOAD</div>
    </div>
  </div>

  <div class="graph-card">
    <label>VELOCIDADE EM TEMPO REAL (MB/s)</label>
    <div class="graph-wrap">
      <canvas id="speedGraph"></canvas>
      <div class="graph-levels">
        <span>10</span>
        <span>7</span>
        <span>5</span>
        <span>2</span>
        <span>0</span>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card"><label>TEMPO</label><div class="val" id="tempo">00:00:00</div></div>
    <div class="card"><label>PING</label><div class="val" id="ping">-- ms</div></div>
  </div>
  <div class="grid-2">
    <div class="card"><label>IP ATUAL</label><div class="val" id="ip">192.168.1.1</div></div>
    <div class="card"><label>IP VPN</label><div class="val" id="ipvpn">--.--</div></div>
  </div>
</div>

<script>
const CIRC = 535;
let estado = 'desconectado';
let seg = 0, downKB = 0, upKB = 0;
let loopT = null, connectT = null, graphT = null;

// ── Graph ──────────────────────────────────────────
const canvas = document.getElementById('speedGraph');
const ctx = canvas.getContext('2d');
const MAX_PTS = 50;
let pts = new Array(MAX_PTS).fill(0);
let graphTick = 0;

function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth - 36;
  canvas.height = 80;
}
window.addEventListener('resize', () => { resizeCanvas(); drawGraph(); });

function drawGraph() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const LEVELS = [0, 2, 5, 7, 10];
  ctx.setLineDash([2, 4]);
  ctx.strokeStyle = '#0a1030';
  ctx.lineWidth = 1;
  LEVELS.forEach(lv => {
    const y = h - (lv / 10) * h;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  });
  ctx.setLineDash([]);
  const step = w / (MAX_PTS - 1);
  ctx.beginPath();
  pts.forEach((v, i) => {
    const x = i * step, y = h - (Math.min(v, 10) / 10) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  ctx.fillStyle = 'rgba(21,101,192,0.15)'; ctx.fill();
  ctx.beginPath();
  pts.forEach((v, i) => {
    const x = i * step, y = h - (Math.min(v, 10) / 10) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#1565C0'; ctx.lineWidth = 2; ctx.stroke();
  // dots at local extremes
  pts.forEach((v, i) => {
    if (i === 0 || i === MAX_PTS - 1) return;
    const prev = pts[i - 1], next = pts[i + 1];
    if ((v > prev && v > next) || (v < prev && v < next)) {
      const x = i * step, y = h - (Math.min(v, 10) / 10) * h;
      ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#1E88E5'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    }
  });
}

function pushPt(v) {
  pts.shift();
  pts.push(v);
  drawGraph();
}

// Wave pattern: up-down-up-down, then plateau, then final climb
function graphValue() {
  graphTick++;
  const t = graphTick;
  let v;
  if (t <= 30) {
    // oscillating waves growing
    v = 2 + 2.5 * Math.sin(t * 0.35) + (t / 30) * 1.5 + Math.random() * 0.4;
  } else if (t <= 50) {
    // plateau with small ripples
    v = 4 + 0.6 * Math.sin(t * 0.5) + Math.random() * 0.3;
  } else {
    // final climb to top
    const climb = Math.min((t - 50) * 0.22, 6);
    v = 4 + climb + 0.3 * Math.sin(t * 0.8) + Math.random() * 0.2;
  }
  return Math.max(0, Math.min(v, 10));
}

// ── Toggle ─────────────────────────────────────────
function toggle() {
  if (estado === 'conectando') return;
  if (estado === 'conectado') { desconectar(); return; }
  conectar();
}

function conectar() {
  estado = 'conectando';
  document.getElementById('btnTxt').textContent = 'AGUARDE';
  setStatus('connecting', 'A VERIFICAR REDE...');
  document.getElementById('progressSvg').classList.remove('connected');
  document.getElementById('bar').style.strokeDashoffset = CIRC;
  document.getElementById('btnCircle').classList.remove('on');

  const phases = [
    { pct: 15, txt: 'VERIFICANDO SERVIDOR...' },
    { pct: 35, txt: 'ESTABELECENDO TÚNEL...' },
    { pct: 60, txt: 'ENCRIPTANDO DADOS...' },
    { pct: 85, txt: 'QUASE PRONTO...' },
  ];
  let phaseIdx = 0;
  let p = 0;

  connectT = setInterval(() => {
    p += 1.3;
    document.getElementById('bar').style.strokeDashoffset = CIRC - (CIRC * p / 100);
    if (phaseIdx < phases.length && p >= phases[phaseIdx].pct) {
      setStatus('connecting', phases[phaseIdx].txt);
      phaseIdx++;
    }
    if (p >= 100) {
      clearInterval(connectT);
      onConnected();
    }
  }, 45);
}

function onConnected() {
  estado = 'conectado';
  document.getElementById('progressSvg').classList.add('connected');
  document.getElementById('bar').style.strokeDashoffset = 0;
  document.getElementById('btnCircle').classList.add('on');
  document.getElementById('btnTxt').textContent = 'CONECTADO';
  setStatus('connected', 'CONECTADO');
  document.getElementById('boxDown').classList.add('active');
  document.getElementById('boxUp').classList.add('active');
  document.getElementById('ping').textContent = rand(18, 42) + ' ms';
  document.getElementById('ipvpn').textContent = '10.' + rand(10,200) + '.' + rand(0,255) + '.' + rand(1,254);
  seg = 0; downKB = 0; upKB = 0;
  graphTick = 0;
  startLoop();
}

function startLoop() {
  loopT = setInterval(() => {
    seg++;
    const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
    document.getElementById('tempo').textContent =
      pad(h) + ':' + pad(m) + ':' + pad(s);

    // Download grows faster, upload slower — ratio ~6:1
    const baseDown = 0.18 + (seg * 0.012);  // ramps up from ~180 KB/s
    const baseUp   = 0.03 + (seg * 0.0018); // ramps up from ~30 KB/s
    const jDown = baseDown + Math.random() * baseDown * 0.4;
    const jUp   = baseUp   + Math.random() * baseUp   * 0.4;

    downKB += jDown * 1024;
    upKB   += jUp   * 1024;

    fmtStat(downKB, 'downVal', 'downUnit');
    fmtStat(upKB,   'upVal',   'upUnit');

    const gv = graphValue();
    pushPt(gv);
  }, 1000);
}

function fmtStat(kb, elV, elU) {
  const el = document.getElementById(elV);
  const eu = document.getElementById(elU);
  if (kb >= 1024 * 1024) {
    el.textContent = (kb / (1024 * 1024)).toFixed(2);
    eu.textContent = 'GB';
  } else if (kb >= 1024) {
    el.textContent = (kb / 1024).toFixed(1);
    eu.textContent = 'MB';
  } else {
    el.textContent = Math.floor(kb);
    eu.textContent = 'KB';
  }
}

function desconectar() {
  clearInterval(loopT); clearInterval(connectT);
  loopT = null; connectT = null;
  estado = 'desconectado';
  document.getElementById('progressSvg').classList.remove('connected');
  document.getElementById('bar').style.strokeDashoffset = CIRC;
  document.getElementById('btnCircle').classList.remove('on');
  document.getElementById('btnTxt').textContent = 'CONECTAR';
  setStatus('', 'DESCONECTADO');
  document.getElementById('boxDown').classList.remove('active');
  document.getElementById('boxUp').classList.remove('active');
  document.getElementById('ipvpn').textContent = '--.--';
  document.getElementById('ping').textContent = '-- ms';
}

function reset() {
  if (estado !== 'conectado') return;
  seg = 0; downKB = 0; upKB = 0; graphTick = 0;
  pts = new Array(MAX_PTS).fill(0);
  document.getElementById('tempo').textContent = '00:00:00';
  document.getElementById('downVal').textContent = '0';
  document.getElementById('downUnit').textContent = 'KB';
  document.getElementById('upVal').textContent = '0';
  document.getElementById('upUnit').textContent = 'KB';
  drawGraph();
}

function setStatus(cls, txt) {
  const sr = document.getElementById('statusRow');
  sr.className = 'status' + (cls ? ' ' + cls : '');
  document.getElementById('statusTxt').textContent = txt;
}

function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pad(n) { return String(n).padStart(2, '0'); }

function openServers() {}
function openCountries() {}

window.addEventListener('load', () => {
  resizeCanvas();
  drawGraph();
});
</script>
</body>
  </html>
