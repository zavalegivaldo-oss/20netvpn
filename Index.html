<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendente</title>
<style>
  body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family: sans-serif;
  }
  h1{
    color:#ff0000;
    font-size:42px;
    font-weight:900;
    letter-spacing:8px;
    margin:0;
  }
  p{
    color:#666;
    margin-top:15px;
    font-size:14px;
  }
  .loader{
    width:40px;
    height:40px;
    border:3px solid #222;
    border-top:3px solid #ff0000;
    border-radius:50%;
    margin-top:20px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin{
    to{transform:rotate(360deg)}
  }
</style>
</head>
<body>
  <h1>PENDENTE</h1>
  <div class="loader"></div>
  <p>processando... acabou</p>
</body>
  </html>
